<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMMIXHUI // META_ARCHIVE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#050510',
              cyan: '#00f0ff',
              purple: '#8a2be2',
              pink: '#ff007f'
            }
          },
          animation: {
            'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 元宇宙背景：星空網格與掃描線 */
    body {
      background-color: #050510;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      color: #e0e0e0;
      overflow-x: hidden;
    }
    
    /* 掃描線特效 overlay */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 100;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    /* 玻璃擬物與霓虹邊框 */
    .glass-card {
      background: rgba(10, 10, 25, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.05), inset 0 0 20px rgba(138, 43, 226, 0.05);
      transition: all 0.3s ease;
    }
    
    .glass-card:hover {
      border-color: rgba(0, 240, 255, 0.8);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 30px rgba(138, 43, 226, 0.2);
      transform: translateY(-5px) scale(1.02);
    }

    /* Web3 多圖太空艙滑動軸 */
    .cyber-scrollbar {
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: #00f0ff #050510;
    }
    .cyber-scrollbar::-webkit-scrollbar { height: 6px; }
    .cyber-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
    .cyber-scrollbar::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 10px; }

    /* 霓虹文字發光 */
    .neon-text {
      color: #fff;
      text-shadow: 0 0 5px #00f0ff, 0 0 10px #00f0ff, 0 0 20px #00f0ff;
    }
    .neon-text-pink {
      color: #fff;
      text-shadow: 0 0 5px #ff007f, 0 0 10px #ff007f, 0 0 20px #ff007f;
    }

    /* 裁切角 UI (Cyberpunk 邊角) */
    .clip-corner {
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
    }
  </style>
</head>
<body class="font-mono selection:bg-cyber-cyan selection:text-black">

  <!-- HUD 導覽列 -->
  <nav class="fixed w-full top-0 z-40 bg-cyber-black/80 backdrop-blur-md border-b border-cyber-cyan/30 flex justify-between items-center p-4 md:px-8">
    <div class="flex items-center gap-4">
      <div class="w-3 h-3 rounded-full bg-cyber-cyan animate-pulse-fast shadow-[0_0_10px_#00f0ff]"></div>
      <div class="text-xl md:text-2xl font-black tracking-widest text-cyber-cyan">
        MMMIXHUI<span class="text-white opacity-50"> // META_ARCHIVE</span>
      </div>
    </div>
    <div class="hidden md:flex gap-4 text-xs font-bold text-cyber-cyan/70 tracking-widest">
      <span>SYS.STATUS: [ <span class="text-green-400">ONLINE</span> ]</span>
      <span>BLOCK_HEIGHT: <span id="block-height">SYNCING...</span></span>
    </div>
  </nav>

  <main class="pt-28 pb-20 px-4 md:px-8 max-w-[1800px] mx-auto">
    
    <!-- 讀取狀態 / 錯誤提示 -->
    <div id="status-display" class="flex flex-col items-center justify-center mt-32">
      <div class="w-32 h-32 border-4 border-cyber-cyan/20 border-t-cyber-cyan rounded-full animate-spin mb-8 shadow-[0_0_30px_rgba(0,240,255,0.2)]"></div>
      <h2 class="text-2xl font-black tracking-widest text-cyber-cyan animate-pulse">ESTABLISHING CONNECTION TO SECURE NODE...</h2>
      <p class="text-cyber-purple mt-2 text-sm">Decrypting visual assets from Web3 Storage</p>
    </div>

    <!-- 專案畫廊網格 -->
    <div id="portfolio-grid" class="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-10"></div>
  </main>

  <!-- 全息投影 Lightbox (沉浸式檢視器) -->
  <div id="lightbox" class="fixed inset-0 z-50 hidden bg-cyber-black/95 backdrop-blur-xl p-4 md:p-8 overflow-y-auto flex items-center justify-center">
    <div class="w-full max-w-7xl glass-card clip-corner flex flex-col relative animate-float">
      
      <!-- 視窗控制列 -->
      <div class="flex justify-between items-center p-4 border-b border-cyber-cyan/30 bg-white/5">
        <div class="flex items-center gap-3">
          <div class="w-2 h-2 bg-cyber-pink rounded-full shadow-[0_0_8px_#ff007f]"></div>
          <span class="font-bold tracking-widest text-cyber-cyan text-xs md:text-sm">ASSET_VIEWER_v3.0</span>
        </div>
        <button onclick="closeLightbox()" class="text-cyber-cyan hover:text-white hover:bg-cyber-pink/50 border border-cyber-cyan/30 px-4 py-1 text-sm tracking-widest transition-colors clip-corner">
          DISCONNECT [X]
        </button>
      </div>

      <!-- 檢視器內容區 -->
      <div class="p-6 md:p-10 flex flex-col xl:flex-row gap-8 max-h-[80vh] overflow-y-auto cyber-scrollbar">
        
        <!-- 左側 HUD 資訊板 -->
        <div class="xl:w-1/3 flex flex-col gap-6">
          <div class="inline-block border border-cyber-purple text-cyber-purple px-3 py-1 text-xs tracking-widest w-fit bg-cyber-purple/10">
            CLASS: <span id="lb-category" class="text-white"></span>
          </div>
          <h2 id="lb-title" class="text-3xl md:text-5xl font-black uppercase neon-text leading-tight"></h2>
          
          <div class="relative p-6 border border-cyber-cyan/20 bg-cyber-cyan/5 clip-corner mt-4">
            <div class="absolute top-0 left-0 w-2 h-2 bg-cyber-cyan"></div>
            <div class="absolute bottom-0 right-0 w-2 h-2 bg-cyber-cyan"></div>
            <p id="lb-desc" class="text-sm md:text-base text-gray-300 leading-relaxed whitespace-pre-wrap font-sans"></p>
          </div>
        </div>

        <!-- 右側多圖垂直流 -->
        <div id="lb-gallery" class="xl:w-2/3 flex flex-col gap-6"></div>
      </div>
    </div>
  </div>

  <script>
    // ★ 請在此填寫您的 Public JSON API 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbyTNadGAs8vcQWzYJmQcGK-UqhYbSAPtOnEy4hFn7DQnEn6Haj3iWhVvrI1PjJKEAED2w/exec"; 
    
    let globalData = [];

    // 模擬區塊鏈高度跳動
    setInterval(() => {
      const el = document.getElementById('block-height');
      if(el) el.innerText = '#' + Math.floor(1000000 + Math.random() * 9000000);
    }, 2500);

    window.onload = async function() {
      const statusDisplay = document.getElementById('status-display');
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('API Connection Rejected');
        
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        
        globalData = data.reverse(); 
        statusDisplay.style.display = 'none';
        renderGrid(globalData);
      } catch (error) {
        statusDisplay.innerHTML = `
          <div class="border border-cyber-pink bg-cyber-pink/10 p-8 clip-corner text-center max-w-lg">
            <h2 class="neon-text-pink text-3xl font-black mb-4">NODE_SYNC_FAILED</h2>
            <p class="text-white/80 text-sm">無法連線至去中心化資料庫。請確認 API 節點狀態。</p>
            <p class="text-cyber-pink text-xs mt-4">ERR_CODE: ${error.message}</p>
          </div>
        `;
      }
    };

    function renderGrid(projects) {
      const grid = document.getElementById('portfolio-grid');
      grid.innerHTML = ''; 
      
      projects.forEach((p, index) => {
        // 卡片容器 (玻璃擬物 + 裁切角)
        const card = document.createElement('div');
        card.className = "glass-card clip-corner flex flex-col cursor-pointer group";
        card.onclick = () => openLightbox(index);

        // 影像輪播區塊 (橫向滑動)
        const galleryWrap = document.createElement('div');
        galleryWrap.className = "w-full flex cyber-scrollbar border-b border-cyber-cyan/30 aspect-video md:aspect-[16/10]";
        
        if (p.images && p.images.length > 0) {
          p.images.forEach((imgUrl, i) => {
            const imgContainer = document.createElement('div');
            imgContainer.className = "w-full h-full shrink-0 snap-center relative";
            
            const img = document.createElement('img');
            img.src = imgUrl;
            img.className = "w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity duration-500";
            img.loading = "lazy";
            
            // 圖片數量指示器 (HUD 風格)
            const indicator = document.createElement('div');
            indicator.className = "absolute bottom-3 right-3 bg-cyber-black/80 border border-cyber-cyan/50 text-cyber-cyan text-[10px] px-2 py-1 backdrop-blur-sm font-bold tracking-widest";
            indicator.textContent = `IMG [ ${i + 1} / ${p.images.length} ]`;

            imgContainer.appendChild(img);
            imgContainer.appendChild(indicator);
            galleryWrap.appendChild(imgContainer);
          });
        } else {
          // 無圖片的防呆畫面
          galleryWrap.innerHTML = `<div class="w-full h-full flex items-center justify-center text-cyber-cyan/50 text-sm tracking-widest bg-cyber-black/50">NO_ASSET_FOUND</div>`;
        }

        // 資訊區塊
        const infoWrap = document.createElement('div');
        infoWrap.className = "p-6 flex flex-col gap-3 relative overflow-hidden";
        
        // 分類標籤
        const catEl = document.createElement('div');
        catEl.className = "text-cyber-purple text-xs font-bold tracking-widest uppercase mb-1";
        catEl.textContent = `> ${p.分類}`; 

        // 專案名稱
        const titleEl = document.createElement('h3');
        titleEl.className = "text-xl font-bold uppercase text-white tracking-wider truncate group-hover:text-cyber-cyan transition-colors";
        titleEl.textContent = p.專案名稱;

        // 假資料指紋 (增加 Tech 氛圍)
        const hashEl = document.createElement('div');
        hashEl.className = "text-[10px] text-gray-600 mt-2 truncate opacity-50";
        hashEl.textContent = `HASH: 0x${Math.random().toString(16).substring(2, 14).toUpperCase()}...`;

        infoWrap.appendChild(catEl);
        infoWrap.appendChild(titleEl);
        infoWrap.appendChild(hashEl);
        
        card.appendChild(galleryWrap);
        card.appendChild(infoWrap);
        grid.appendChild(card);
      });
    }

    function openLightbox(index) {
      const p = globalData[index];
      const lb = document.getElementById('lightbox');
      
      document.getElementById('lb-category').textContent = p.分類;
      document.getElementById('lb-title').textContent = p.專案名稱;
      document.getElementById('lb-desc').textContent = p.描述;
      
      const gallery = document.getElementById('lb-gallery');
      gallery.innerHTML = ''; 
      
      if (p.images) {
        p.images.forEach(imgUrl => {
          const imgWrap = document.createElement('div');
          imgWrap.className = "relative p-2 border border-cyber-cyan/20 bg-cyber-black/50";
          
          const img = document.createElement('img');
          img.src = imgUrl;
          img.className = "w-full object-contain filter contrast-125";
          img.loading = "lazy";
          
          // 添加裝飾性十字準星
          const crosshair = `<div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-cyber-cyan/50"></div>
                             <div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-cyber-cyan/50"></div>
                             <div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-cyber-cyan/50"></div>
                             <div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-cyber-cyan/50"></div>`;
          imgWrap.innerHTML = crosshair;
          imgWrap.appendChild(img);
          gallery.appendChild(imgWrap);
        });
      }

      lb.classList.remove('hidden');
      document.body.style.overflow = 'hidden'; 
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }
  </script>
</body>
</html>
